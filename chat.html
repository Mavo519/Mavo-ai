<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mavo AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 95%;
      max-width: 900px;
      margin: auto;
      padding: 20px 0;
    }

    header {
      text-align: center;
      padding: 15px 0 20px;
    }

    h1 {
      margin: 0;
      color: #00d4ff;
      font-size: 32px;
    }

    .subtitle {
      color: #9ca3af;
      margin-top: 8px;
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .mode {
      padding: 12px 8px;
      border: 1px solid #29344d;
      background: #141c30;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .mode:hover {
      background: #1d2942;
    }

    .mode.active {
      background: #00a8cc;
      border-color: #00d4ff;
    }

    .current-mode {
      text-align: center;
      margin: 10px 0;
      color: #00d4ff;
      font-weight: bold;
    }

    #chat {
      height: 430px;
      overflow-y: auto;
      background: #111827;
      border: 1px solid #26324a;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .message {
      margin: 10px 0;
      padding: 12px;
      border-radius: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #1d4ed8;
      margin-left: 10%;
    }

    .ai {
      background: #1f2937;
      margin-right: 10%;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    #message {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #111;
      font-size: 16px;
      outline: none;
    }

    #sendButton {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #00b8d9;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing {
      color: #9ca3af;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .modes {
        grid-template-columns: repeat(2, 1fr);
      }

      .input-area {
        flex-direction: column;
      }

      #sendButton {
        width: 100%;
      }

      .user {
        margin-left: 3%;
      }

      .ai {
        margin-right: 3%;
      }

      #chat {
        height: 400px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>⚡ Mavo AI</h1>
      <div class="subtitle">Your AI workspace</div>
    </header>

    <div class="modes">

      <button class="mode active" data-mode="assistant">
        🤖 Assistant
      </button>

      <button class="mode" data-mode="code">
        💻 Code
      </button>

      <button class="mode" data-mode="write">
        ✍️ Write
      </button>

      <button class="mode" data-mode="study">
        📚 Study
      </button>

      <button class="mode" data-mode="ideas">
        💡 Ideas
      </button>

      <button class="mode" data-mode="forex">
        📈 Forex
      </button>

    </div>

    <div class="current-mode">
      Mode: <span id="modeName">Mavo Assistant</span>
    </div>

    <div id="chat">

      <div class="message ai">
        <b>Mavo AI:</b> Welcome! Choose a mode above and ask me anything.
      </div>

    </div>

    <div class="input-area">

      <input
        id="message"
        type="text"
        placeholder="Ask Mavo AI anything..."
        autocomplete="off"
      >

      <button id="sendButton">
        Send
      </button>

    </div>

  </div>

  <script>

    let currentMode = "assistant";

    const modeNames = {
      assistant: "Mavo Assistant",
      code: "Mavo Code",
      write: "Mavo Write",
      study: "Mavo Study",
      ideas: "Mavo Ideas",
      forex: "Mavo Forex"
    };

    const modeButtons = document.querySelectorAll(".mode");
    const modeName = document.getElementById("modeName");
    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("sendButton");
    const chat = document.getElementById("chat");

    modeButtons.forEach(button => {

      button.addEventListener("click", () => {

        modeButtons.forEach(btn => {
          btn.classList.remove("active");
        });

        button.classList.add("active");

        currentMode = button.dataset.mode;

        modeName.textContent = modeNames[currentMode];

        messageInput.placeholder =
          currentMode === "forex"
            ? "Ask Mavo Forex about a market setup..."
            : `Ask ${modeNames[currentMode]}...`;

      });

    });

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = `message ${type}`;

      message.textContent = text;

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    async function sendMessage() {

      const message = messageInput.value.trim();

      if (!message) {
        return;
      }

      addMessage(`You: ${message}`, "user");

      messageInput.value = "";

      sendButton.disabled = true;

      const typingMessage =
        addMessage("Mavo AI is thinking...", "ai");

      typingMessage.classList.add("typing");

      try {

        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message,
            mode: currentMode
          })

        });

        const data = await response.json();

        typingMessage.remove();

        if (!response.ok) {

          addMessage(
            "Mavo AI error: " +
            (data.error || "Something went wrong."),
            "ai"
          );

          return;
        }

        addMessage(
          `Mavo AI: ${data.reply}`,
          "ai"
        );

      } catch (error) {

        typingMessage.remove();

        addMessage(
          "Connection error. Please try again.",
          "ai"
        );

        console.error(error);

      } finally {

        sendButton.disabled = false;

        messageInput.focus();

      }

    }

    sendButton.addEventListener(
      "click",
      sendMessage
    );

    messageInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      }
    );

  </script>

</body>
</html>
